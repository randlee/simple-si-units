[workspace]
members = [
    "crates/units-x",
    "crates/units-x-python",
]
exclude = [
    "reference/simple-si-units-core",
    "reference/simple-si-units-macros",
    "reference/simple-si-units",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["unit-x contributors"]
license = "MPL-2.0"
repository = "https://github.com/randlee/simple-si-units"
homepage = "https://github.com/randlee/simple-si-units"
rust-version = "1.85"
