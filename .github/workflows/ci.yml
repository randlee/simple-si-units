name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main, "sprint/**", "integrate/*", "integration/*"]
  push:
    branches: [develop, main, "integrate/*", "integration/*", "sprint/*"]

jobs:
  repo-ci:
    name: Repo CI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.100"

      - name: Install Python CI dependencies
        run: python -m pip install -r python/requirements-ci.txt

      - name: Install just
        run: cargo install just --locked --version 1.49.0

      - name: Install sc-lint
        run: cargo install sc-lint --locked --version 0.3.0

      - name: Install sc-lint-boundary
        run: cargo install sc-lint-boundary --locked --version 0.3.0

      - name: Run repo CI
        run: just ci
