name: CI

on:
  pull_request:
    branches: [develop, main, "integrate/*", "integration/*"]
  push:
    branches: [develop, main]

jobs:
  repo-ci:
    name: Repo CI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "stable"
          components: clippy, rustfmt

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python generator dependencies
        run: python -m pip install numpy pandas

      - name: Install just
        run: cargo install just --locked

      - name: Install sc-lint
        run: cargo install sc-lint --locked

      - name: Install sc-lint-boundary
        run: cargo install sc-lint-boundary --locked

      - name: Run repo CI
        run: just ci
